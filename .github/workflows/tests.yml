name: unit and integration tests

on:
  pull_request:
  push:
    branches: [master, main, develop]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gophermart
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: gophermart_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U gophermart -d gophermart_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests and coverage
        run: |
          go test -race ./internal/... ./cmd/... ./migrations/... -coverprofile=unit.cover.out
          go tool cover -func=unit.cover.out
          go tool cover -func=unit.cover.out | awk '/total:/ {gsub(/%/, "", $3); if ($3 < 60) exit 1}'
      - name: Integration tests
        env:
          TEST_DATABASE_DSN: postgres://gophermart:test-only-password@localhost:5432/gophermart_test?sslmode=disable
        run: go test -race ./tests/integration -count=1 -timeout=120s
      - name: Vet
        run: go vet ./...
